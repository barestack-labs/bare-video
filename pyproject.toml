[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bare-video"
version = "0.5.0"
description = "Local-first agent-directed short-form video editing pipeline"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Paul Martin Ablaza"}]
dependencies = []

[project.optional-dependencies]
local-asr = ["faster-whisper>=1.1"]

[project.scripts]
bare-video = "barevideo.cli:main"

[tool.setuptools.packages.find]
include = ["barevideo*"]
